<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <title>myPlanning</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash de couleur.
      // Doit rester synchrone et sans dépendance : c'est le tout premier script exécuté.
      // Le thème est la seule chose que l'app garde dans le navigateur — c'est une
      // préférence d'appareil, pas une donnée de planning ; celles-ci vivent dans
      // data/planning.json, qu'on ne peut pas lire de façon synchrone ici.
      ;(function () {
        try {
          var stored = localStorage.getItem('myplanning.theme') // 'light' | 'dark' | 'system'
          var mode = stored === 'light' || stored === 'dark' ? stored : null
          if (!mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = mode
          document.documentElement.style.colorScheme = mode
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

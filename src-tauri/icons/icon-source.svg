<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Icône de l'application desktop myPlanning.

    Fond bleu accent (#0052CC, la même valeur que le jeton d'accent en thème
    clair) avec le pictogramme "calendar" de Lucide (https://lucide.dev),
    tracés copiés tels quels depuis
    node_modules/lucide-react/dist/esm/icons/calendar.mjs (viewBox 24×24),
    mis à l'échelle ~30x et recentrés. Uniquement Lucide comme source
    d'icônes dans ce projet, interface comme icône d'app.
  -->
  <rect width="1024" height="1024" rx="220" fill="#0052CC" />
  <g transform="translate(152, 152) scale(30)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2v3" />
    <path d="M16 2v3" />
    <rect x="3" y="3" width="18" height="18" rx="2" />
    <path d="M3 9h18" />
  </g>
</svg>

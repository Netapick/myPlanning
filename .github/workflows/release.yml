name: Release

# Sur un tag `vX.Y.Z` : build l'installateur Windows et le publie comme
# GitHub Release — c'est cette Release que l'app va vérifier au démarrage
# (voir src/lib/appUpdate.ts). Le tag doit correspondre à la version dans
# package.json / src-tauri/tauri.conf.json (pas de bump automatique ici).
#
# Un tag contenant `-demo` (ex. `v1.0.0-demo`) publie en pré-release GitHub
# au lieu d'une release normale : elle reste téléchargeable depuis la page
# Releases mais n'apparaît jamais comme « latest » via l'API GitHub, donc ne
# déclenche jamais la bannière de mise à jour chez les utilisateurs déjà
# installés (voir `checkForUpdate` dans `src/lib/appUpdate.ts`).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Détecter un tag de démo
        id: demo
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-demo* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: >-
            ${{ steps.demo.outputs.prerelease == 'true' && format('myPlanning {0} (démo)', github.ref_name)
            || format('myPlanning {0}', github.ref_name) }}
          releaseBody: 'Voir les changements de cette version.'
          releaseDraft: false
          prerelease: ${{ steps.demo.outputs.prerelease == 'true' }}
